[project]
name = "codereview-agent"
version = "1.0.0"
description = "基于 LLM 与静态代码分析工具的智能代码审查 Agent"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
# vendor 是本地离线依赖目录；.tmp / .pytest_tmp 是运行产物，都不参与检查
exclude = ["vendor", ".tmp", ".pytest_tmp", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
# 本项目统一采用「一行一个 import」的写法，便于逐行增删和阅读；
# 分组仍然是标准的 标准库 / 第三方 / 本项目 三段。
force-single-line = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# examples/ 下是刻意准备的演示样本，不参与本项目的风格约束：
#   * bad_code.py 必须保留裸 except 等问题，否则 AST 演示就没东西可报；
#   * 两个文件的行号都被 README 与测试断言引用，格式化会让它们错位。
"examples/*.py" = ["I001", "E722", "F401", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 把临时目录放在项目内：
# 1) 便于清理，测试产物不会散落到系统 TEMP；
# 2) 在受限环境下（系统临时目录不可写）也能正常运行。
addopts = "-q --basetemp=.pytest_tmp -p no:cacheprovider"
